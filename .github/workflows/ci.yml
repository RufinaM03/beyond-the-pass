name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-infra.lock
      - name: Validate standard CloudFormation offline; no AWS credentials
        run: |
          python -m pip install -r requirements-infra.lock
          python -m pip check
          cfn-lint -r ap-south-1 -t infra/*.json
          python -m unittest tests.test_infrastructure -v
  software-and-fixture-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEMP: ${{ github.workspace }}/data/tmp
      TMP: ${{ github.workspace }}/data/tmp
      TMPDIR: ${{ github.workspace }}/data/tmp
      SQLITE_TMPDIR: ${{ github.workspace }}/data/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/data/cache/pip
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare bounded local scratch
        run: mkdir -p data/tmp data/cache/pip data/package
      - name: Python 3.12 with locked dependency cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.lock
      - name: Node with frontend lock cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple -r requirements-app.lock
          python -m pip check
      - name: Preserve complete synthetic unit suite
        run: python -m unittest discover -s tests -v
      - name: Frontend locked checks and production build
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm test
          npm run build
      - name: Stage explicitly synthetic fixture only
        run: python -m scripts.package_release stage --mode fixture --output data/package/ci-fixture --code-version "$GITHUB_SHA"
      - name: Production gate must reject fixtures
        run: |
          if python -m scripts.package_release validate --mode release --context data/package/ci-fixture; then
            echo 'ERROR: production validation accepted a synthetic fixture'
            exit 1
          fi
      - name: Build Linux amd64 fixture image
        run: |
          docker build --platform linux/amd64 --build-arg ARTIFACT_MODE=fixture --build-arg ARTIFACT_VERSION=fixture-ci-v1 --build-arg CODE_VERSION="$GITHUB_SHA" -t btp-ci:fixture data/package/ci-fixture
      - name: Smoke read-only fixture container and stop it
        run: python -m scripts.container_check --image btp-ci:fixture --mode fixture --context data/package/ci-fixture --output data/tmp/container-fixture.json
      - name: Record fixture-only observations
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('data/tmp/container-fixture.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Synthetic CI fixture only\nNot real model performance or real-release validation.\n\n')
              summary.write(f"Image: {report['image_size_bytes']} bytes; start-to-ready: {report['start_to_ready_seconds']} s; memory observation: {report['stats_observation']['MemUsage']}. Not a capacity guarantee.\n")
          PY
